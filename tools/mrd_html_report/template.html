<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script>(function(){var d=document.documentElement,t;try{t=localStorage.getItem('mrd-theme');}catch(e){}if(!t)t='light';d.setAttribute('data-theme',t);})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MRD report</title>
<style>
:root {
  --bg:#f5f5f7; --surface:#ffffff; --surface-2:#f5f5f7; --border:#e3e3e8;
  --text:#1d1d1f; --muted:#6e6e73; --brand:#0071e3;
  --pass:#34c759; --warn:#ff9f0a; --fail:#ff3b30; --none:#aeaeb2; --grid:#e8e8ed;
  --header-bg:rgba(255,255,255,.72);
  --shadow:0 8px 30px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.05);
  --radius:18px; --sidebar-w:17em;
}
:root[data-theme="dark"] {
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --border:#38383a;
  --text:#f5f5f7; --muted:#98989d; --brand:#0a84ff;
  --pass:#30d158; --warn:#ff9f0a; --fail:#ff453a; --none:#636366; --grid:#2c2c2e;
  --header-bg:rgba(28,28,30,.72);
  --shadow:0 8px 30px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.6);
}
* { box-sizing:border-box; }
/* --scale: report font size chosen with the A- / A+ buttons; every size in rem / em follows it */
html { scroll-behavior:smooth; --scale:1; --hdr:0px; font-size:calc(16px * var(--scale)); }
body {
  color:var(--text); margin:0; background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  font-size:.9375rem; line-height:1.55; -webkit-font-smoothing:antialiased;
  -webkit-print-color-adjust:exact; print-color-adjust:exact;
}
a { color:var(--brand); text-decoration:none; }
.mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
div.header {
  position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
  gap:1em; flex-wrap:wrap; background:var(--header-bg); border-bottom:1px solid var(--border);
  -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px);
  padding:.8em 1.6em;
}
#title { font-size:1.5rem; font-weight:700; letter-spacing:-.022em; }
#subtitle { font-size:.82rem; color:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; text-align:right; }
.tools { display:flex; align-items:center; gap:.5em; flex-wrap:wrap; }
input[type=search], select.sel {
  border:1px solid var(--border); background:var(--surface-2); color:var(--text); border-radius:999px;
  height:2.1em; padding:0 .9em; font:inherit; font-size:.85rem;
}
input[type=search] { min-width:16em; max-width:100%; }
select.sel { max-width:100%; min-width:0; }
.chartbar label { min-width:0; max-width:100%; }
button.chip {
  border:1px solid var(--border); background:var(--surface-2); color:var(--text); border-radius:999px;
  height:2.1em; padding:0 .9em; font:inherit; font-size:.8rem; font-weight:600; cursor:pointer;
}
button.chip.on { background:var(--brand); border-color:var(--brand); color:#fff; }
.tabs { display:inline-flex; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:3px; gap:2px; }
.tabs button { border:0; background:transparent; color:var(--text); border-radius:999px; padding:.3em 1.1em; font:inherit; font-size:.88rem; font-weight:650; cursor:pointer; }
.tabs button.on { background:var(--surface); box-shadow:0 1px 3px rgba(0,0,0,.15); color:var(--brand); }
.f1 { background:#c7c7cc; } .f2 { background:#8ec5ff; } .f3 { background:#4ea1f5; } .f4 { background:#1e7ae0; } .f5 { background:#0f5bb5; } .f6 { background:#0a3d7a; }
:root[data-theme="dark"] .f1 { background:#48484a; }
.swatch { display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-1px; }
div.summary {
  position:fixed; top:4.4em; left:0; width:var(--sidebar-w); height:calc(100vh - 4.4em);
  overflow-y:auto; padding:1em .9em;
}
div.summary h2 { font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:700; margin:.2em 0 .7em .5em; }
div.summary ul { padding:0; margin:0 0 1.2em; list-style:none; }
div.summary li a {
  display:flex; align-items:center; gap:.6em; padding:.4em .7em; margin-bottom:2px; border-radius:8px;
  color:var(--text); font-size:.88rem; font-weight:500;
}
div.summary li a.pat { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
div.summary li a:hover { background:var(--surface-2); }
div.summary li a .n { margin-left:auto; color:var(--muted); font-size:.75rem; }
.dot { flex:0 0 auto; width:9px; height:9px; border-radius:50%; background:var(--none); display:inline-block; }
.dot.pass { background:var(--pass); box-shadow:0 0 0 3px rgba(52,199,89,.16); }
.dot.rev { background:var(--warn); box-shadow:0 0 0 3px rgba(255,159,10,.16); }
.dot.qc { background:var(--fail); box-shadow:0 0 0 3px rgba(255,59,48,.16); }
.dot.neg { width:auto; min-width:22px; height:14px; padding:0 3px; border-radius:7px; background:var(--pass); color:#fff; font:800 9px/14px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; text-align:center; letter-spacing:.02em; box-shadow:0 0 0 3px rgba(52,199,89,.16); }
.dot.neg::before { content:"ND"; }
.dot.np { width:14px; height:14px; background:var(--fail); color:#fff; font:800 10px/14px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; text-align:center; box-shadow:0 0 0 3px rgba(255,59,48,.16); }
.dot.np::before { content:"!"; }
.slot { flex:0 0 26px; display:inline-flex; justify-content:center; }
div.main { margin-left:max(var(--sidebar-w), calc((100% - 1240px) / 2)); margin-right:auto; padding:1.5em 2em 3em; max-width:1240px; }
div.module {
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:1.2em 1.6em 1.4em; margin-bottom:1.4em; scroll-margin-top:5em;
}
div.module > h2 {
  display:flex; align-items:center; gap:.6em; flex-wrap:wrap; font-size:1.1rem; font-weight:650;
  margin:0 0 .9em; padding:0 0 .65em; border-bottom:1px solid var(--border); cursor:pointer; user-select:none;
}
div.module > h2 .sub { color:var(--muted); font-size:.8rem; font-weight:500; }
div.module > h2::after {
  content:""; margin-left:auto; width:.5em; height:.5em; border-right:2px solid var(--muted);
  border-bottom:2px solid var(--muted); transform:rotate(45deg); transition:transform .15s;
}
div.module.collapsed > h2 { margin-bottom:0; padding-bottom:0; border-bottom:0; }
div.module.collapsed > h2::after { transform:rotate(-45deg); }
div.module.collapsed > :not(h2) { display:none; }
p.note { color:var(--muted); font-size:.82rem; margin:.1em 0 .9em; max-width:95ch; overflow-wrap:anywhere; }
.stats { display:flex; gap:.8em; flex-wrap:wrap; margin-bottom:1em; }
.stat { background:var(--surface-2); border-radius:12px; padding:.6em 1em; min-width:8.5em; }
.stat b { display:block; font-size:1.5rem; font-variant-numeric:tabular-nums; }
.stat span { color:var(--muted); font-size:.78rem; }
/* tables scroll inside their box, the column headers stay visible */
.tablewrap { overflow:auto; max-height:max(60vh, calc(100vh - var(--hdr) - 2.5rem)); overscroll-behavior:contain; }
table { border-collapse:collapse; width:100%; font-size:.85rem; border:1px solid var(--border); }
th {
  background:var(--surface-2); color:var(--muted); text-align:left; text-transform:uppercase;
  font-size:.68rem; letter-spacing:.04em; font-weight:700; padding:.55em .8em; border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:2; box-shadow:0 1px 0 var(--border);
}
th.sort { cursor:pointer; white-space:nowrap; } th.sort:hover { color:var(--brand); }
td {
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace; padding:.48em .8em; border-bottom:1px solid var(--border);
  vertical-align:top; overflow-wrap:anywhere;
}
td.nw { white-space:nowrap; }
td.why { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-size:.8rem; min-width:16em; }
td.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
td.low { color:var(--fail); font-weight:700; }
tr.row { cursor:pointer; }
tr.row:hover td, tr.row.hl td { background:var(--surface-2); }
tr.detail > td { background:var(--surface-2); padding:1em 1.2em; }
table.wide td, table.wide th { white-space:nowrap; }
table.wide td:first-child, table.wide th:first-child { position:sticky; left:0; z-index:1; }
table.wide th:first-child { z-index:3; }
.fontsize { display:inline-flex; border:1px solid var(--border); border-radius:999px; overflow:hidden; }
.fontsize button { border:0; background:var(--surface-2); color:var(--text); font:inherit; font-size:.85rem; padding:.3em .65em; cursor:pointer; }
.fontsize button + button { border-left:1px solid var(--border); }
.fontsize button:disabled { color:var(--muted); cursor:default; }
table.wide td:first-child { background:var(--surface); }
.badge {
  display:inline-block; border-radius:999px; padding:.05em .7em; font-size:.75rem; font-weight:700;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; white-space:nowrap;
}
.badge.pass { background:rgba(52,199,89,.16); color:var(--pass); }
.badge.warn { background:rgba(255,159,10,.18); color:var(--warn); }
.badge.fail { background:rgba(255,59,48,.14); color:var(--fail); }
.badge.none { background:rgba(142,142,147,.16); color:var(--muted); }
.badge.rev { background:rgba(255,159,10,.18); color:var(--warn); }
.badge.qc, .badge.np { background:rgba(255,59,48,.14); color:var(--fail); }
.badge.neg { background:rgba(52,199,89,.10); color:var(--pass); border:1px dashed rgba(52,199,89,.6); }
.groups { display:grid; grid-template-columns:repeat(auto-fill,minmax(19em,1fr)); gap:.9em; }
.group { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:.7em .9em; min-width:0; }
.group h3 { margin:0 0 .4em; font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
.kv { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.1fr); gap:.15em .8em; font-size:.8rem; }
.kv .k { color:var(--muted); overflow-wrap:anywhere; }
.kv .v { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; overflow-wrap:anywhere; }
.qcbars { display:grid; grid-template-columns:minmax(10em,16em) minmax(0,1fr) 6.5em; gap:.25em .8em; align-items:center; font-size:.78rem; }
.qcbars .k { color:var(--muted); }
.qcbars .track { position:relative; height:10px; background:var(--grid); border-radius:5px; }
.qcbars .fill { position:absolute; left:0; top:0; bottom:0; border-radius:5px; background:var(--brand); }
.qcbars .fill.low { background:var(--fail); }
.qcbars .thr { position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--text); opacity:.55; }
.qcbars .med { position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--warn); }
.qcbars .v { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; text-align:right; }
pre.aln { font-size:.75rem; overflow-x:auto; margin:.4em 0 0; }
.hidden, div.module.off { display:none !important; }
div.summary li a.on { background:var(--surface-2); font-weight:600; }
.chartbar { display:flex; gap:.6em; align-items:center; flex-wrap:wrap; margin:.2em 0 .6em; font-size:.82rem; color:var(--muted); }
.chartbar label { display:inline-flex; gap:.35em; align-items:center; }
.chart { width:100%; min-height:300px; position:relative; }
.chart svg { display:block; width:100%; height:auto; overflow:visible; }
.chart text { fill:var(--muted); font-size:calc(11px * var(--scale)); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
.chart .gridline { stroke:var(--grid); stroke-width:1; }
.chart .axis { stroke:var(--border); stroke-width:1; }
.chart .thrline { stroke:var(--fail); stroke-width:1.5; stroke-dasharray:5 4; }
.chart .medline { stroke:var(--warn); stroke-width:1.5; stroke-dasharray:2 3; }
.chart circle { cursor:pointer; stroke:var(--surface); stroke-width:1.5; }
.chart circle:hover { stroke:var(--text); stroke-width:2; }
.chart rect.bar { cursor:pointer; }
.chart rect.bar:hover { opacity:.75; }
.legend { display:flex; gap:1em; flex-wrap:wrap; font-size:.78rem; color:var(--muted); margin-top:.3em; }
.legend > span { display:inline-flex; gap:.35em; align-items:center; }
#tip {
  position:fixed; z-index:50; pointer-events:none; background:var(--surface); color:var(--text);
  border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow); padding:.45em .7em;
  font-size:.8rem; max-width:22em; display:none;
}
#tip b { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
.colpick { display:grid; grid-template-columns:repeat(auto-fill,minmax(16em,1fr)); gap:.15em .8em; font-size:.8rem; max-height:16em; overflow-y:auto; border:1px solid var(--border); border-radius:10px; padding:.6em .8em; margin:.4em 0 .8em; }
.colpick label { display:flex; gap:.4em; align-items:center; overflow-wrap:anywhere; }
button.theme-toggle {
  border:1px solid var(--border); background:var(--surface-2); color:var(--text); border-radius:999px;
  width:2.1em; height:2.1em; cursor:pointer; font-size:1rem;
}
mark { background:rgba(255,159,10,.35); color:inherit; border-radius:3px; }
div.footer { color:var(--muted); font-size:.78rem; padding:1em 0; }
button#navtoggle {
  display:none; align-items:center; gap:.5em; margin:.8em .8em .6em; width:calc(100% - 1.6em); padding:.55em .8em;
  border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); color:var(--text);
  font:inherit; font-size:.9rem; cursor:pointer; text-align:left;
}
button#navtoggle .chev { margin-left:auto; color:var(--muted); }
@media (max-width:860px) {
  /* narrow screens: the contents and patient list fold into a bar above the content, closed by default */
  div.summary { position:static; width:auto; height:auto; margin:0 .8em .8em; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); display:none; }
  body.navopen div.summary { display:block; }
  button#navtoggle { display:flex; }
  div.main { margin-left:0; padding:1em; }
  .qcbars { grid-template-columns:minmax(0,1fr) minmax(0,1fr) 5.5em; }
}
@media print {
  .tablewrap { max-height:none; overflow:visible; } th { position:static; }
  div.header { position:static; } div.summary, .tools, .chartbar { display:none; }
  div.main { margin-left:0; max-width:none; } div.module { break-inside:avoid; box-shadow:none; }
}
</style>

<body>
<div class="header">
  <div style="display:flex;align-items:center;gap:1em;flex-wrap:wrap"><div id="title">MRD report</div>
    <div class="tabs" role="tablist"><button data-view="results" class="on">Results</button><button data-view="qc">Wet-lab QC</button></div></div>
  <div class="tools">
    <input type="search" id="q" placeholder="Search all columns (H number, sample, gene, marker, ...)">
    <button class="chip" data-f="all">All</button>
    <button class="chip" data-f="pass"><span class="dot pass"></span> Detected</button>
    <button class="chip" data-f="rev"><span class="dot rev"></span> Review</button>
    <button class="chip" data-f="qc"><span class="dot qc"></span> QC failed</button>
    <button class="chip" data-f="np"><span class="dot np"></span> Not processed</button>
    <button class="chip" data-f="neg"><span class="dot neg"></span> Not detected</button>
    <span class="fontsize" role="group" aria-label="Font size"><button id="fs-dn" title="Smaller font">A&minus;</button><button id="fs-0" title="Default font size">A</button><button id="fs-up" title="Larger font">A+</button></span>
    <button class="theme-toggle" id="theme" title="Light / dark">&#9681;</button>
  </div>
  <div id="subtitle"></div>
</div>
<button id="navtoggle" aria-expanded="false" aria-controls="nav"><span id="navtoggle-label">Contents and patients</span><span class="chev">&#9662;</span></button>
<div class="summary" id="nav"></div>
<div class="main" id="main"><div id="view-results"></div><div id="view-qc" class="hidden"></div></div>
<div id="tip"></div>
<script id="mrd-data" type="application/json">

</script>
<script>
(function () {
  'use strict';
  var D = JSON.parse(document.getElementById('mrd-data').textContent);
  var H = D.header, R = D.rows;
  var NS = 'http://www.w3.org/2000/svg';
  function col(n) { return H.indexOf(n); }
  function g(r, n) { var i = col(n); return i < 0 ? '' : (r[i] === undefined ? '' : r[i]); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function isNA(v) { return v === undefined || v === '' || v === 'NA' || v === '.'; }
  function num(v) { if (isNA(v)) return null; var x = parseFloat(v); return isFinite(x) ? x : null; }
  function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem('mrd-' + k)); localStorage.setItem('mrd-' + k, JSON.stringify(v)); } catch (e) { return null; } }

  // ---- sample status -------------------------------------------------------------------------
  function md(r) { return g(r, 'Mutation detected'); }
  function warn(r) { var s = g(r, 'pipeline_status'); return s !== '' && s !== 'ok'; }
  function review(r) { return g(r, 'physician_review') === 'YES' || md(r) === 'REVIEW'; }
  // colour classes (in this order of precedence):
  //   np   red !   sample not processed (pipeline failure, no result)
  //   qc   red     a QC criterion failed
  //   pass green   mutation detected, all QC passed
  //   rev  orange  detected with physician review (non-exact match, warning)
  //   neg  green ND  QC passed, not detected
  var CLS = {np:'Not processed', qc:'QC failed', pass:'Detected', rev:'Review', neg:'Not detected'};
  function cls(r) {
    if (/^FAILED/.test(g(r, 'pipeline_status')) || isNA(md(r))) return 'np';
    if (qcLow(r) || g(r, 'Low-quality evidence at marker') === 'TRUE' || noqcOnly(r)) return 'qc';
    if (md(r) === 'TRUE') return 'pass';
    if (review(r) || warn(r)) return 'rev';
    return 'neg';
  }
  // marker called by the branch without quality cutoffs, but not with the Phred 30 cutoffs: not reportable,
  // the sample goes back to the wet lab
  function noqcOnly(r) { return g(r, 'Found only without quality cutoffs') === 'TRUE'; }
  var NOQC_TEXT = 'mutation found only without quality cutoffs, not with Phred 30: repeat in the wet lab';
  function noqcReason(r) {
    var m = g(r, 'No quality cutoffs: marker match'), x = num(g(r, 'No quality cutoffs: AF'));
    return NOQC_TEXT + ' (' + (isNA(m) ? '' : m.replace(/_/g, ' ') + ' ') + g(r, 'No quality cutoffs: HGVS_C') +
      ', VAF ' + (x === null ? 'NA' : (x * 100).toFixed(x < 0.01 ? 3 : 2) + '%') + ', ' + g(r, 'No quality cutoffs: alt reads') +
      ' alt reads, depth ' + g(r, 'No quality cutoffs: depth') + ')';
  }
  function badge(v, c) { return '<span class="badge ' + c + '">' + esc(v) + '</span>'; }
  function mdBadge(r) { var c = cls(r); return '<span class="dot ' + c + '" style="margin-right:.45em;vertical-align:-1px"></span>' + badge(CLS[c], c); }

  // ---- QC metrics: column names of the v24/v25 report first, older report names as fallback ---
  function pick(names) { for (var i = 0; i < names.length; i++) if (col(names[i]) >= 0) return names[i]; return null; }
  var M = [
    // all reads of the sample (after demultiplexing and primer trimming, before any quality filter)
    {id:'all_reads', label:'All reads', cols:['ALL reads'], kind:'count', log:true},
    {id:'all_mapped', label:'Mapped / all reads', cols:['ALL mapped / all reads'], kind:'ratio'},
    {id:'all_chrom', label:'On marker chromosome / all reads', cols:['ALL on marker chromosome / all reads'], kind:'ratio'},
    {id:'all_site', label:'Reads at the target site (all reads)', cols:['ALL reads at target site'], kind:'count', log:true},
    {id:'all_site_ratio', label:'At target site / all reads', cols:['ALL at target site / all reads'], kind:'ratio'},
    {id:'site_of_mapped', label:'At target site / mapped reads (primer specificity)', derive:function (r) { var a = num(g(r, 'ALL reads at target site')), b = num(g(r, 'ALL mapped reads')); return (a !== null && b) ? a / b : null; }, kind:'ratio'},
    {id:'fastp_pass', label:'Passing fastp quality filter / all reads', cols:['UMI branch reads after fastp / all reads'], kind:'ratio'},
    {id:'fam_all', label:'Read families / all reads', cols:['Read families / all reads'], kind:'ratio'},
    {id:'fam_mean', label:'Mean read pairs per family', cols:['FAMILY mean size'], kind:'x'},
    {id:'fam_single', label:'Singleton families (1 read pair) / families', derive:function (r) { var t = famTotal(r); var a = num(g(r, 'FAMILY size 1')); return (t && a !== null) ? a / t : null; }, kind:'ratio'},
    {id:'all_lost', label:'Lost before mapping (trimming, length) / all reads', cols:['ALL reads lost before mapping / all reads'], kind:'ratio'},
    {id:'fam_reads', label:'Read families (deduplicated reads)', cols:['FAMILY_BAM total reads (read families)', 'Total records'], kind:'count', log:true},
    {id:'raw_reads', label:'Reads after the fastp filter (UMI branch)', cols:['RAW_BAM total reads'], kind:'count', log:true},
    {id:'per_family', label:'Filtered reads per read family', derive:function (r) { var a = mv('raw_reads', r), b = mv('fam_reads', r); return (a !== null && b) ? a / b : null; }, kind:'x', log:false},
    {id:'fam_mapped', label:'Mapped / total, read families (no unmapped reads by design)', cols:['FAMILY_BAM mapped/total', 'mapped/total'], kind:'ratio', thr:0.8},

  function drawStrip() {
    var box = document.getElementById('c1'); box.innerHTML = '';
    var m = MI[document.getElementById('c1m').value]; if (!m) return;
    var log = document.getElementById('c1log').checked;
    var idx = ORDER.filter(function (i) { return visible(i); });
    var W = Math.max(box.clientWidth, 320), Hh = 300, L = Math.round(64 * SC()), Rr = 16, T = 14, B = Math.round(46 * SC());
    var svg = el('svg', {viewBox:'0 0 ' + W + ' ' + Hh}, box);
    var rg = range(m, idx, log);
    if (!rg || !idx.length) { el('text', {x:L, y:40}, svg).textContent = 'No values for the selected samples.'; return; }
    var y = scale(rg[0], rg[1], Hh - B, T, log);
    ticks(y, m).forEach(function (v) { var yy = y(v); el('line', {x1:L, x2:W - Rr, y1:yy, y2:yy, 'class':'gridline'}, svg); var t = el('text', {x:L - 6, y:yy + 4, 'text-anchor':'end'}, svg); t.textContent = tickLabel(m, v); });
    el('line', {x1:L, x2:L, y1:T, y2:Hh - B, 'class':'axis'}, svg);
    var bw = (W - L - Rr) / idx.length;
    idx.forEach(function (i, k) {
      var x = mv(m.id, R[i]), cx = L + bw * (k + 0.5);
      if (idx.length <= 60 || k % Math.ceil(idx.length / 60) === 0) { var t = el('text', {x:cx, y:Hh - B + 14, 'text-anchor':'middle'}, svg); t.textContent = sampleKey(R[i]); }
      if (x === null || (log && x <= 0)) return;
      var yy = y(x), base = y(log ? Math.pow(10, y.lo) : Math.max(rg[0], 0));
      var bar = el('rect', {x:cx - Math.min(bw * 0.35, 14), width:Math.min(bw * 0.7, 28), y:Math.min(yy, base), height:Math.max(1, Math.abs(base - yy)), rx:3, 'class':'bar', fill:colorOf(i, [m])}, svg);
      bar.style.opacity = cls(R[i]) === 'neg' ? '.35' : '.9';
      bar.addEventListener('mousemove', function (e) { showTip(e, tipHtml(i, [esc(m.label) + ': <b>' + fmt(m, x) + '</b>' + (m.thr !== undefined ? ' (threshold ' + fmt(m, m.thr) + ')' : '')])); });
      bar.addEventListener('mouseleave', hideTip);
      bar.addEventListener('click', function () { hideTip(); goSample(i); });
    });
    var lab = el('text', {x:L, y:Hh - 8}, svg); lab.textContent = 'sample';
    if (m.thr !== undefined) { var ty = y(m.thr); el('line', {x1:L, x2:W - Rr, y1:ty, y2:ty, 'class':'thrline'}, svg); var tt = el('text', {x:W - Rr, y:ty - 4, 'text-anchor':'end'}, svg); tt.textContent = 'threshold ' + fmt(m, m.thr); }
    if (MED[m.id] !== null && (!log || MED[m.id] > 0)) { var my = y(MED[m.id]); el('line', {x1:L, x2:W - Rr, y1:my, y2:my, 'class':'medline'}, svg); }
  }
  function drawScatter() {
    var box = document.getElementById('c2'); box.innerHTML = '';
    var mx = MI[document.getElementById('c2x').value], my = MI[document.getElementById('c2y').value]; if (!mx || !my) return;
    var lx = document.getElementById('c2xl').checked, ly = document.getElementById('c2yl').checked;
    var idx = ORDER.filter(function (i) { var a = mv(mx.id, R[i]), b = mv(my.id, R[i]); return visible(i) && a !== null && b !== null && (!lx || a > 0) && (!ly || b > 0); });
    var W = Math.max(box.clientWidth, 320), Hh = 340, L = Math.round(64 * SC()), Rr = 20, T = 14, B = Math.round(46 * SC());
    var svg = el('svg', {viewBox:'0 0 ' + W + ' ' + Hh}, box);
    if (!idx.length) { el('text', {x:L, y:40}, svg).textContent = 'No samples with both values.'; return; }
    var rx = range(mx, idx, lx), ry = range(my, idx, ly);
    var x = scale(rx[0], rx[1], L, W - Rr, lx), y = scale(ry[0], ry[1], Hh - B, T, ly);
    ticks(y, my).forEach(function (v) { var yy = y(v); el('line', {x1:L, x2:W - Rr, y1:yy, y2:yy, 'class':'gridline'}, svg); var t = el('text', {x:L - 6, y:yy + 4, 'text-anchor':'end'}, svg); t.textContent = tickLabel(my, v); });
    ticks(x, mx).forEach(function (v) { var xx = x(v); el('line', {x1:xx, x2:xx, y1:T, y2:Hh - B, 'class':'gridline'}, svg); var t = el('text', {x:xx, y:Hh - B + 14, 'text-anchor':'middle'}, svg); t.textContent = tickLabel(mx, v); });
    if (mx.thr !== undefined) { var tx = x(mx.thr); el('line', {x1:tx, x2:tx, y1:T, y2:Hh - B, 'class':'thrline'}, svg); }
    if (my.thr !== undefined) { var ty = y(my.thr); el('line', {x1:L, x2:W - Rr, y1:ty, y2:ty, 'class':'thrline'}, svg); }
    var xl = el('text', {x:(L + W - Rr) / 2, y:Hh - 10, 'text-anchor':'middle'}, svg); xl.textContent = mx.label + (lx ? ' (log)' : '');
    var yl = el('text', {x:12, y:T + 4}, svg); yl.textContent = my.label + (ly ? ' (log)' : '');
    idx.forEach(function (i) {
      var a = mv(mx.id, R[i]), b = mv(my.id, R[i]);
      var c = el('circle', {cx:x(a), cy:y(b), r:6, fill:colorOf(i, [mx, my])}, svg);
      if (cls(R[i]) === 'neg') c.setAttribute('fill-opacity', '.35');
      c.addEventListener('mousemove', function (e) { showTip(e, tipHtml(i, [esc(mx.label) + ': <b>' + fmt(mx, a) + '</b>', esc(my.label) + ': <b>' + fmt(my, b) + '</b>'])); });
      c.addEventListener('mouseleave', hideTip);
      c.addEventListener('click', function () { hideTip(); goSample(i); });
    });
  }
  // horizontal bars, one row per sample
  function hbars(boxId, rowsFn, tipFn) {
    var box = document.getElementById(boxId); if (!box) return; box.innerHTML = '';
    var idx = ORDER.filter(function (i) { return visible(i); });
    var W = Math.max(box.clientWidth, 320), L = Math.round(92 * SC()), Rr = Math.round(50 * SC()), rowH = Math.round(18 * Math.max(1, SC())), T = 18, Hh = T + idx.length * rowH + 22;
    var svg = el('svg', {viewBox:'0 0 ' + W + ' ' + Hh}, box);
    var x = function (v) { return L + Math.max(0, Math.min(1, v)) * (W - L - Rr); };
    [0, 0.25, 0.5, 0.75, 1].forEach(function (v) { el('line', {x1:x(v), x2:x(v), y1:T - 4, y2:Hh - 18, 'class':'gridline'}, svg); var tt = el('text', {x:x(v), y:Hh - 4, 'text-anchor':'middle'}, svg); tt.textContent = (v * 100) + '%'; });
    idx.forEach(function (i, k) {
      var y = T + k * rowH, lab = el('text', {x:L - 8, y:y + rowH / 2 + 4, 'text-anchor':'end'}, svg);
      lab.textContent = sampleKey(R[i]) + ' ' + (C_PAT ? g(R[i], C_PAT) : '');
      var g0 = el('g', {}, svg); g0.style.cursor = 'pointer';
      rowsFn(R[i]).forEach(function (seg) {
        if (seg.w === null || seg.w === undefined || isNaN(seg.w)) return;
        el('rect', {x:x(seg.x0 || 0), y:y + 2, width:Math.max(0, x((seg.x0 || 0) + seg.w) - x(seg.x0 || 0)), height:rowH - 4, rx:2, fill:seg.color, 'class':seg.cls || ''}, g0);
      });
      g0.addEventListener('mousemove', function (e) { showTip(e, tipFn(i)); });
      g0.addEventListener('mouseleave', hideTip);
      g0.addEventListener('click', function () { hideTip(); goSample(i); });
    });
  }
  function drawFunnel() {
    if (!HAS_FUNNEL) return;
    var st = STAGES.filter(function (x) { return MI[x.id] && M.indexOf(MI[x.id]) >= 0; });
    hbars('cf', function (r) {
      if (mv('all_reads', r) === null) return [];
      return [{w:1, cls:'f1', color:'var(--grid)'}].concat(st.map(function (x) { return {w:mv(x.id, r), color:x.color}; }));
    }, function (i) {
      var r = R[i];
      return tipHtml(i, ['all reads: <b>' + fmt(MI.all_reads, mv('all_reads', r)) + '</b>'].concat(st.map(function (x) { return esc(x.label) + ': <b>' + pct(mv(x.id, r)) + '</b>'; })));
    });
  }
  var FCOL = ['#c7c7cc', '#8ec5ff', '#4ea1f5', '#1e7ae0', '#0f5bb5', '#0a3d7a'];
  function drawFam() {
    if (!HAS_FAM) return;
    hbars('cfam', function (r) {
      var tot = famTotal(r); if (!tot) return [];
      var x0 = 0;
      return FBINS.map(function (b, k) { var v = (num(g(r, b)) || 0) / tot, seg = {x0:x0, w:v, color:FCOL[k]}; x0 += v; return seg; });
    }, function (i) {
      var r = R[i], tot = famTotal(r);
      return tipHtml(i, FBINS.map(function (b) { var v = num(g(r, b)); return esc(b.replace('FAMILY size ', 'size ')) + ': <b>' + (v === null ? 'NA' : Math.round(v).toLocaleString('en-US') + (tot ? ' (' + pct(v / tot) + ')' : '')) + '</b>'; }));
    });
  }
  var VIEW = 'results';
  function SC() { return SCALE || 1; }   // chart margins follow the font size
  function drawCharts() { if (VIEW === 'qc' && document.getElementById('c1')) { drawStrip(); drawScatter(); drawFunnel(); drawFam(); } }
  // ---- sections: the centre panel shows only the selected section --------------------------------
  // Results: overview (run overview, all patients) | decision | noqc | corr | all | p<k> (one patient)
  // Wet-lab QC: qcsum (run summary, verdict per sample) | primers | funnel | families | qctable | charts
  var QC_IDS = {qc:1, qcsum:1, wetlab:1, primers:1, funnel:1, families:1, qctable:1, charts:1};
  var SEC_OF = {wetlab:'qcsum', results:'overview', qc:'qcsum'};
  var SEC = 'overview';
  function secOf(id) { return SEC_OF[id] || (document.getElementById(id) ? id : 'overview'); }
  function inSec(m, s) {
    var id = m.id;
    if (/^p[0-9]+$/.test(id)) return s === 'overview' || s === id;
    return secOf(id) === s;
  }
  function show(id, keepScroll) {
    var s = secOf(id), v = QC_IDS[s] ? 'qc' : 'results';
    SEC = s; VIEW = v;
    document.getElementById('view-results').classList.toggle('hidden', v !== 'results');
    document.getElementById('view-qc').classList.toggle('hidden', v !== 'qc');
    document.getElementById('nav-results').classList.toggle('hidden', v !== 'results');
    document.getElementById('nav-qc').classList.toggle('hidden', v !== 'qc');
    Array.prototype.forEach.call(document.querySelectorAll('#main div.module'), function (m) {
      var on = inSec(m, s);
      m.classList.toggle('off', !on);
      if (on && m.id === s) m.classList.remove('collapsed');
    });
    Array.prototype.forEach.call(document.querySelectorAll('#nav a'), function (a) { a.classList.toggle('on', a.getAttribute('href') === '#' + s); });
    Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (b) { b.classList.toggle('on', b.dataset.view === v); });
    var cur = document.querySelector('#nav a.on');
    document.getElementById('navtoggle-label').textContent = (v === 'qc' ? 'Wet-lab QC' : 'Results') + (cur ? ': ' + cur.textContent.replace(/[0-9]+$/, '') : '');
    if (!keepScroll) window.scrollTo(0, 0);
    drawCharts();
  }
  function go(id) { show(id); try { history.replaceState(null, '', '#' + secOf(id)); } catch (e) {} }
  function setView(v, keepScroll) { show(v === 'qc' ? 'qcsum' : 'overview', keepScroll); }
  Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (b) {
    b.addEventListener('click', function () { go(b.dataset.view === 'qc' ? 'qcsum' : 'overview'); });
  });
  function fromHash() { var h = (location.hash || '').slice(1); show(h || 'overview', false); }
  window.addEventListener('hashchange', fromHash);
  function setNav(open) { document.body.classList.toggle('navopen', open); document.getElementById('navtoggle').setAttribute('aria-expanded', open ? 'true' : 'false'); }
  document.getElementById('navtoggle').addEventListener('click', function () { setNav(!document.body.classList.contains('navopen')); });
  // a link in the folded list closes it again, so the target is in view
  document.getElementById('nav').addEventListener('click', function (e) {
    var a = e.target.closest('a'); if (!a) return;
    e.preventDefault();
    if (window.matchMedia('(max-width:860px)').matches) setNav(false);
    go(a.getAttribute('href').slice(1));
  });
  (function () {
    var s1 = document.getElementById('c1m'), s2x = document.getElementById('c2x'), s2y = document.getElementById('c2y');
    var first = MI.fam_mapped && M.indexOf(MI.fam_mapped) >= 0 ? 'fam_mapped' : (M[0] && M[0].id);
    if (first) s1.value = first;
    s2x.value = MI.raw_reads && M.indexOf(MI.raw_reads) >= 0 ? 'raw_reads' : (M[0] && M[0].id);
    s2y.value = MI.fam_reads && M.indexOf(MI.fam_reads) >= 0 ? 'fam_reads' : (M[1] ? M[1].id : s2x.value);
    function syncLog() {
      document.getElementById('c1log').checked = !!(MI[s1.value] && MI[s1.value].log);
      document.getElementById('c2xl').checked = !!(MI[s2x.value] && MI[s2x.value].log);
      document.getElementById('c2yl').checked = !!(MI[s2y.value] && MI[s2y.value].log);
    }
    syncLog();
    [s1, s2x, s2y].forEach(function (s) { s.addEventListener('change', function () { syncLog(); drawCharts(); }); });
    ['c1log', 'c2xl', 'c2yl'].forEach(function (id) { document.getElementById(id).addEventListener('change', drawCharts); });
    var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(drawCharts, 150); });
  })();

  // ---- font size (per viewer, remembered in this browser) -------------------------------------
  var FS_MIN = 0.6, FS_MAX = 1.4, FS_STEP = 0.1;
  function setHdr() { document.documentElement.style.setProperty('--hdr', document.querySelector('div.header').offsetHeight + 'px'); }
  function setScale(s) {
    s = Math.round(Math.max(FS_MIN, Math.min(FS_MAX, s)) * 10) / 10;
    document.documentElement.style.setProperty('--scale', s);
    document.getElementById('fs-dn').disabled = s <= FS_MIN; document.getElementById('fs-up').disabled = s >= FS_MAX;
    document.getElementById('fs-0').title = 'Default font size (now ' + Math.round(s * 100) + '%)';
    store('scale', s); setHdr(); drawCharts();
    return s;
  }
  var SCALE = setScale(+(store('scale') || 1));
  document.getElementById('fs-dn').addEventListener('click', function () { SCALE = setScale(SCALE - FS_STEP); });
  document.getElementById('fs-up').addEventListener('click', function () { SCALE = setScale(SCALE + FS_STEP); });
  document.getElementById('fs-0').addEventListener('click', function () { SCALE = setScale(1); });
  window.addEventListener('resize', setHdr);

  document.getElementById('theme').addEventListener('click', function () {
    var d = document.documentElement, t = d.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    d.setAttribute('data-theme', t); try { localStorage.setItem('mrd-theme', t); } catch (e) {}
  });
  renderTables();
  renderAll();
  fromHash();
})();
</script>
</body>
